# Выпуск Tetrachrome — по тегу vX.Y.Z (ставит пользователь или мастер выпуска Anvil).
# Общий workflow семьи Anvil: сборка под Windows, tetrachrome-X.Y.Z-windows-x64.zip, SHA256SUMS,
# GitHub Release с заметками из аннотации тега. Тег набора — тот же, что у anvil-ui в Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: AgitAngst/Anvil/.github/workflows/rust-release.yml@kit-v0.2.0
    with:
      app: tetrachrome
      bins: tetrachrome
